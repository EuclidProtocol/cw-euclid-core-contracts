[workspace]
resolver = "2"

members = [
    "contracts/hub/*",
    "contracts/liquidity/*",
    "contracts/forwarding/*",
    "contracts/common/*",
    "packages/*",
    "tests-integration",
]

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
strip = true

[workspace.dependencies]
euclid = { path = "./packages/euclid" }
euclid-ibc = { path = "./packages/euclid_ibc" }
euclid-utils = { path = "./packages/euclid_utils" }
forwarding = { path = "./packages/forwarding" }

cosmwasm-std = "2.2.2"
cosmwasm-schema = "2.2.2"
cw-storage-plus = "2.0.0"
cw-utils = "2.0.0"
cw2 = "2.0.0"
cw20 = "2.0.0"
cw20-base = "2.0.0"
schemars = "0.8.22"
serde = { version = "1.0.208", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.49" }
itertools = "0.10"

mock = { path = "./packages/mock" }
cw-multi-test = { version = "2.3.2", features = [
    "cosmwasm_1_2",
    "cosmwasm_1_1",
] }
