[workspace]
resolver = "2"

members = [
    "contracts/hub/*",
    "contracts/hub_utilities/*",
    "contracts/liquidity/*",
    "contracts/forwarding/*",
    "contracts/common/*",
    "packages/*",
    "tests-integration",
    "tests-fuzz",
    "tools/schema-to-proto",
]

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
strip = true

[workspace.dependencies]
euclid = { path = "./packages/euclid" }
euclid-pool = { path = "./packages/pool" }
euclid-ibc = { path = "./packages/euclid_ibc" }
euclid-utils = { path = "./packages/euclid_utils" }
forwarding = { path = "./packages/forwarding" }
relayer = { path = "./packages/relayer" }

cosmwasm-std = "=3.0.4"
cosmwasm-schema = "3.0.4"
cw-storage-plus = "3.0.1"
cw-utils = "3.0.0"
cw2 = "3.0.0"
cw20 = "2.0.0"
cw20-base = "2.0.0"
schemars = "0.8.22"
serde = { version = "1.0.208", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.49" }
itertools = "0.10"
function_name = "0.3"

mock = { path = "./packages/mock" }
cw-multi-test = "3.0.1"
cw-orch = "0.28.0"
