name: Generate and Push Protos

on:
  push:
    branches: [development, main]
    paths:
      - "contracts/**"
      - "packages/**"
      - "tools/schema-to-proto/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-gen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Generate protos
        run: make proto

      - uses: bufbuild/buf-setup-action@v1

      - name: Lint protos
        run: cd proto && buf lint

      - name: Push to BSR
        run: buf push proto --label "${{ github.sha }}" --label "${{ github.ref_name }}"
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

      # Notify consumer repos with branch info
      - name: Trigger frontend codegen
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: EuclidProtocol/euclid-frontend-monorepo
          event-type: contract-types-updated
          client-payload: '{"sha": "${{ github.sha }}", "branch": "${{ github.ref_name }}"}'

      - name: Trigger backend codegen
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: EuclidProtocol/euclid_api
          event-type: contract-types-updated
          client-payload: '{"sha": "${{ github.sha }}", "branch": "${{ github.ref_name }}"}'
