name: Basic

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
      - gc/clp # Temporary branch for CLV pool testing
    types: [opened, synchronize, reopened]

concurrency:
  group: basic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.86.0
          rustflags: ""
          cache: true

      - name: Run unit tests
        run: cargo unit-test --locked
        env:
          RUST_BACKTRACE: 1

      - name: Run integration tests
        run: cargo test -p tests-integration
        env:
          RUST_BACKTRACE: 1

      - name: Run fuzz tests
        run: cargo test -p tests-fuzz
        env:
          RUST_BACKTRACE: 1

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
          rustflags: ""
          cache: true

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -W clippy::pedantic

  compile:
    name: Compile WASM
    needs: [test, lints]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.86.0
          target: wasm32-unknown-unknown
          rustflags: ""
          cache: true

      - name: Compile WASM contracts
        run: cargo wasm --locked
        env:
          RUSTFLAGS: "-C link-arg=-s"
